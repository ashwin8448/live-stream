name: Deploy to AWS ECR using OIDC

on:
  push:
    branches:
      - twilio

jobs:
  build-and-push-ecr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438990558550:role/github-cicd-twilio  # Replace with your role ARN
          aws-region: ap-south-1                                   # Update to your AWS region

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
   
      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t issac04/twilio-web:latest .
       

      - name: Push to DockerHub
        run: |
          docker push issac04/twilio-web:latest
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0' 

      - name: Authenticate with Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir $HOME/.kube
          ls $HOME/.kube/
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

 
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/